AWSTemplateFormatVersion: '2010-09-09'
Description: Cinehub web app as one ECS service on a SpaceMade Fargate Hub. Uses the hub's cluster, HTTPS listener and private subnets.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Application }
        Parameters: [DesiredCount, ListenerPriority, DatabaseUrl]
      - Label: { default: Optional sign-in providers }
        Parameters: [GithubId, GithubSecret, GoogleClientId, GoogleClientSecret]
    ParameterLabels:
      DesiredCount: { default: Task count }
      ListenerPriority: { default: Listener rule priority (unused on the hub listener) }
      DatabaseUrl: { default: MongoDB connection string (replica set) }

Parameters:
  # Bound by Cloud from the selected hub (see cloud.yaml); hidden from users.
  ClusterName: { Type: String }
  ListenerArn: { Type: String }
  VpcId: { Type: AWS::EC2::VPC::Id }
  ServiceSubnets: { Type: CommaDelimitedList }
  LoadBalancerSecurityGroup: { Type: AWS::EC2::SecurityGroup::Id }
  Hostname:
    Type: String
    Description: Public hostname routed to this app on the hub listener.
  CloudImageWeb:
    Type: String
    Description: Verified image reference, set by Cloud for this version.
  NextAuthSecret:
    Type: String
    NoEcho: true
    MinLength: 32

  # User inputs.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  ListenerPriority:
    Type: Number
    MinValue: 1
    MaxValue: 50000
  DatabaseUrl:
    Type: String
    NoEcho: true
    AllowedPattern: '^mongodb(\+srv)?://.+'
    ConstraintDescription: Must be a MongoDB connection string.
  GithubId: { Type: String, Default: '' }
  GithubSecret: { Type: String, Default: '', NoEcho: true }
  GoogleClientId: { Type: String, Default: '' }
  GoogleClientSecret: { Type: String, Default: '', NoEcho: true }

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub Cinehub runtime secrets for ${AWS::StackName}
      SecretString: !Sub
        - '{"DATABASE_URL":"${DatabaseUrl}","NEXTAUTH_SECRET":"${NextAuthSecret}","NEXTAUTH_JWT_SECRET":"${NextAuthSecret}","GITHUB_SECRET":"${GithubSecret}","GOOGLE_CLIENT_SECRET":"${GoogleClientSecret}"}'
        - {}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 30

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Cinehub tasks for ${AWS::StackName}
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '512'
      Memory: '1024'
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref CloudImageWeb
          Essential: true
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - { Name: NEXTAUTH_URL, Value: !Sub 'https://${Hostname}' }
            - { Name: GITHUB_ID, Value: !Ref GithubId }
            - { Name: GOOGLE_CLIENT_ID, Value: !Ref GoogleClientId }
          Secrets:
            - { Name: DATABASE_URL, ValueFrom: !Sub '${AppSecret}:DATABASE_URL::' }
            - { Name: NEXTAUTH_SECRET, ValueFrom: !Sub '${AppSecret}:NEXTAUTH_SECRET::' }
            - { Name: NEXTAUTH_JWT_SECRET, ValueFrom: !Sub '${AppSecret}:NEXTAUTH_JWT_SECRET::' }
            - { Name: GITHUB_SECRET, ValueFrom: !Sub '${AppSecret}:GITHUB_SECRET::' }
            - { Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub '${AppSecret}:GOOGLE_CLIENT_SECRET::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: web

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /api/hello
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'

  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ListenerArn
      Priority: !Ref ListenerPriority
      Conditions:
        - Field: host-header
          HostHeaderConfig: { Values: [!Ref Hostname] }
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      Cluster: !Ref ClusterName
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref ServiceSubnets
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup

Outputs:
  Url:
    Value: !Sub 'https://${Hostname}'
  ServiceName:
    Value: !GetAtt Service.Name
  LogGroup:
    Value: !Ref LogGroup
