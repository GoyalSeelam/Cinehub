name: Docker

# Pull requests and master: build only, to prove the image still builds.
# Tags vX.Y.Z: build and push to Docker Hub as X.Y.Z. Cloud imports the
# same tag through its Git webhook and copies the image by digest.
on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # Repository variable, e.g. "youruser/cinehub". Set in
      # Settings > Secrets and variables > Actions > Variables.
      IMAGE: docker.io/${{ vars.DOCKERHUB_REPOSITORY }}
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        if: env.PUSH == 'true'
        run: |
          test -n "${{ vars.DOCKERHUB_REPOSITORY }}" || { echo "::error::Set the DOCKERHUB_REPOSITORY repository variable."; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, matching Cloud's ${Git.Version}.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          # Fargate tasks in deploy/fargate.yaml run X86_64.
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
